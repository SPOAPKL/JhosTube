<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor | JhosTube</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="barra">
    <a href="index.html" class="logo">MiTube</a>
  </header>
  <main class="reproductor">
    <article>
      <video id="video" controls></video>
      <h1 id="titulo"></h1>
      <p id="descripcion"></p>

      <section class="comentarios">
        <h2>Comentarios</h2>
        <form id="form-comentario">
          <input id="autor" placeholder="Tu nombre" required>
          <textarea id="texto" placeholder="Escribe un comentario" required></textarea>
          <button type="submit">Comentar</button>
        </form>
        <div id="lista-comentarios"></div>
      </section>
    </article>

    <aside>
      <h2>Más como este</h2>
      <div id="recomendados" class="lista"></div>
    </aside>
  </main>
  <script src="api.js"></script>
  <script src="player.js"></script>
</body>
</html>
